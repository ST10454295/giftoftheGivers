trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: sql-secrets

steps:
  # 1. ADD FIREWALL RULE (Allows the DevOps agent to connect to Azure SQL)
  - task: AzurePowerShell@5
    displayName: 'Add SQL Firewall Rule'
    inputs:
      azureSubscription: 'MY-AZURE-DB-CONNECTION' 
      ScriptType: 'InlineScript'
      Inline: |
        $agentIP = (Invoke-RestMethod -Uri "https://api.ipify.org")
        New-AzSqlServerFirewallRule -ResourceGroupName "GiftRG" `
          -ServerName "gotg-server-st10454295" `
          -FirewallRuleName "AzureDevOpsAgent" `
          -StartIPAddress $agentIP -EndIPAddress $agentIP
      azurePowerShellVersion: 'LatestVersion'

  # 2. DEPLOY THE SQL SCRIPT
  - task: SqlAzureDacpacDeployment@1
    displayName: 'Deploy Schema Update (C3)'
    inputs:
      azureSubscription: 'MY-AZURE-DB-CONNECTION'
      AuthenticationType: 'server'
      ServerName: 'gotg-server-st10454295.database.windows.net'
      DatabaseName: 'GOTG_Final' 
      SqlUsername: 'sqladmin'
      SqlPassword: '$(SqlAdminPassword)'
      deployType: 'SqlTask'
      SqlFile: '$(Build.SourcesDirectory)/scripts/c3_Update.sql'

  # 3. REMOVE FIREWALL RULE (Cleanup for security)
  - task: AzurePowerShell@5
    displayName: 'Remove SQL Firewall Rule'
    condition: always() 
    inputs:
      azureSubscription: 'MY-AZURE-DB-CONNECTION'
      ScriptType: 'InlineScript'
      Inline: |
        Remove-AzSqlServerFirewallRule -ResourceGroupName "GiftRG" `
          -ServerName "gotg-server-st10454295" `
          -FirewallRuleName "AzureDevOpsAgent"
      azurePowerShellVersion: 'LatestVersion'
